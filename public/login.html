<!DOCTYPE html>
<html lang="ar" dir="rtl" data-force-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>تسجيل الدخول · LearnEra</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/styles.css" />
  <script src="/js/theme.js"></script>
  <script src="/js/i18n.js"></script>
</head>
<body>
  <div class="login-page" id="loginPage">
    <!-- Animated background: glowing orbs + twinkling stars -->
    <div class="login-bg" aria-hidden="true">
      <div class="login-orbs" id="loginOrbs">
        <span class="orb o1"></span>
        <span class="orb o2"></span>
        <span class="orb o3"></span>
        <span class="orb o4"></span>
        <span class="orb o5"></span>
      </div>
      <div class="login-stars" id="loginStars"></div>
    </div>

    <div class="login-card">

      <!-- Left side: brand + illustration -->
      <div class="login-left">
        <div class="brand">
          <div class="brand-logo"><img src="/uploads/Logo.jpeg" alt="LearnEra" /></div>
          <div class="brand-text">
            <div class="brand-name"><span class="bn-l">L</span><span class="bn-mid">earn</span><span class="bn-era">Era</span></div>
            <div class="brand-tag" data-i18n="login.tagline">منصة التعليم الذكي</div>
          </div>
        </div>

        <div class="login-illustration">
          <img src="/uploads/login-illustration.svg" alt="LearnEra illustration" />
        </div>

        <div class="login-footer">
          <p data-i18n="login.copyright">© 2026 LearnEra. جميع الحقوق محفوظة</p>
          <p class="powered">Powered by LearnEra</p>
        </div>
      </div>

      <!-- Wave divider -->
      <div class="login-wave" aria-hidden="true">
        <svg viewBox="0 0 100 100" preserveAspectRatio="none">
          <path d="M0,0 L100,0 C55,32 55,68 100,100 L0,100 Z" />
        </svg>
      </div>

      <!-- Right side: login form -->
      <div class="login-right">
        <div class="login-form-wrap">
          <h1 class="login-title" data-i18n="login.title">تسجيل الدخول</h1>
          <p class="login-subtitle" data-i18n="login.subtitle">مرحباً بعودتك! سجل الدخول للمتابعة</p>

          <div id="error" class="alert alert-error"></div>

          <form id="loginForm" novalidate>
            <div class="field">
              <label for="email" data-i18n="login.email">البريد الإلكتروني</label>
              <input type="email" id="email" name="email" placeholder="you@learnera.com" autocomplete="username" dir="ltr" required />
            </div>

            <div class="field">
              <label for="password" data-i18n="login.password">كلمة المرور</label>
              <div class="password-field">
                <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password" required />
                <button type="button" class="toggle-password" id="togglePassword" aria-label="إظهار كلمة المرور">
                  <svg class="eye-icon eye-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
                  <svg class="eye-icon eye-closed" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" y1="2" x2="22" y2="22"/></svg>
                </button>
              </div>
            </div>

            <div class="forgot-row">
              <a href="#" class="forgot-link" data-i18n="login.forgot">نسيت كلمة المرور؟</a>
            </div>

            <button type="submit" class="btn btn-primary btn-block login-btn" id="submitBtn" data-i18n="login.signIn">تسجيل الدخول</button>
          </form>

          <div class="login-terms">
            <a href="#" data-i18n="login.terms">الشروط والأحكام وسياسة الخصوصية</a>
          </div>

          <div class="login-support">
            <span data-i18n="login.supportPre">هل تواجه مشكلة؟ تواصل معنا عبر</span>
            <a href="mailto:Learnera80@gmail.com" class="support-email">Learnera80@gmail.com</a>
          </div>
        </div>
      </div>

    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/login.js"></script>
</body>
</html>
